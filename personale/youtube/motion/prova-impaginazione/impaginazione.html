<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(fonts/it400.ttf);font-style:italic}
@font-face{font-family:T;src:url(fonts/it800.ttf);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0E0D0C;color:#F2F2F0}
.abs{position:absolute}
.ser{font-family:G;font-style:italic;font-weight:400;white-space:nowrap}
.san{font-family:T;font-weight:800;white-space:nowrap;letter-spacing:-.035em}
.mask{position:absolute;overflow:hidden;padding:0 .1em .14em 0}
.mask>span{display:inline-block}
.ov{position:absolute;inset:0;pointer-events:none}
#cam{position:absolute;inset:0;overflow:hidden}
#vid{position:absolute;inset:0;transform-origin:52% 45%}
#vid img{position:absolute;inset:0;width:1920px;height:1080px}
#ins{position:absolute;inset:0;background:#0E0D0C;overflow:hidden;display:none}
#stage{position:absolute;inset:0;perspective:1300px}
.piece{position:absolute;width:34px;height:42px;border-radius:3px}
</style></head><body>
<div id="cam">
 <div id="vid"><img id="bg" src="bg/b0001.jpg"></div>
 <!-- ombra morbida dietro al testo sopra il video -->
 <div id="shade" class="abs" style="left:-200px;top:520px;width:1250px;height:700px;background:radial-gradient(closest-side,rgba(14,13,12,.82),rgba(14,13,12,0));opacity:0"></div>
 <div class="mask" style="left:110px;top:600px"><span id="n2" class="san" style="font-size:190px;line-height:1">02</span></div>
 <div class="mask" style="left:110px;top:800px"><span id="t2" class="ser" style="font-size:124px;line-height:1.1">Impaginazione</span></div>

 <div id="ins"><div id="stage">
  <div id="cl" class="abs" style="left:250px;top:330px;width:300px;height:300px"><img src="assets/claude-c.svg" style="width:300px;height:300px;filter:drop-shadow(0 0 40px rgba(217,119,87,.35))"></div>
  <div class="mask" style="left:250px;top:680px;width:420px"><span id="cln" class="ser" style="font-size:84px">Claude</span></div>
  <div id="cv" class="abs" style="left:1370px;top:330px;width:300px;height:300px"><img src="assets/canva-c.svg" style="width:300px;height:300px"></div>
  <div class="mask" style="left:1370px;top:680px;width:420px"><span id="cvn" class="ser" style="font-size:84px">Canva</span></div>
  <div id="line" class="abs" style="left:600px;top:479px;width:720px;height:3px;background:#6A6668;transform-origin:left"></div>
  <div class="mask" style="left:600px;top:380px;width:720px;text-align:center"><span id="mcp" class="san" style="font-size:52px;color:#E8692B">MCP</span></div>
  <div id="pulse" class="abs" style="left:600px;top:470px;width:22px;height:22px;border-radius:50%;background:#E8692B;box-shadow:0 0 30px 10px rgba(232,105,43,.7);opacity:0"></div>
  <div id="pieces"></div>
 </div>
 <img class="ov" src="assets/leak.png" id="leak" style="mix-blend-mode:screen;left:-60px;width:2040px;height:1080px">
 </div>
</div>
<img class="ov" src="assets/vignette.png" style="opacity:.75">
<div id="grs"></div>
<script>
const $=id=>document.getElementById(id);
const c=x=>Math.min(1,Math.max(0,x));
const eo=x=>1-Math.pow(1-c(x),5);
const eio=x=>{x=c(x);return x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2};
const ob=x=>{x=c(x);const k=1.9;return 1+(k+1)*Math.pow(x-1,3)+k*Math.pow(x-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;
function rev(el,t0,t,dur=.7,blur=18){const p=eo((t-t0)/dur);el.style.transform=`translateY(${(1-p)*105}%)`;el.style.filter=`blur(${(1-p)*blur}px)`;}
const grs=$('grs');for(let i=0;i<8;i++){const g=document.createElement('img');g.className='ov';g.src=`assets/grain${i}.png`;g.style.cssText='mix-blend-mode:overlay;opacity:.16;display:none';grs.appendChild(g);}
// pezzi di tavola che viaggiano sulla linea
const PC=['#2B2829','#8E8C87','#BFA58F','#E8692B','#F2F2F0'];const pieces=[];
for(let i=0;i<5;i++){const d=document.createElement('div');d.className='piece';d.style.background=PC[i];$('pieces').appendChild(d);pieces.push(d);}
// precarica i fotogrammi del video
const FR=[];for(let i=1;i<=325;i++){const im=new Image();im.src=`bg/b${String(i).padStart(4,'0')}.jpg`;FR.push(im);}

// tempi (dalla trascrizione)
const T={imp:2.42,claude:5.44,mcp:7.24,canva:8.52,coll:9.46,giu:10.86};
const WIN=T.claude-.18, WOUT=T.giu-.1;

window.render=async function(t){
 const fi=Math.min(324,Math.floor(t*25+1e-6));const bg=$('bg');const src=FR[fi].src;
 if(bg.src!==src){bg.src=src;await bg.decode().catch(()=>{});}
 // zoom a scatto su "impaginazione", poi spinta lenta
 const z=1+0.07*eo((t-T.imp+.05)/.35)+0.02*c((t-T.imp)/3);
 // whip in: il video scappa a sinistra
 const w=eio((t-WIN)/.34);
 $('vid').style.transform=`translateX(${-w*1920}px) scale(${z})`;
 // testo sopra il video
 $('shade').style.opacity=eo((t-T.imp+.2)/.5)*.9;$('shade').style.transform=`translateX(${-w*1920}px)`;
 rev($('n2'),T.imp-.42,t,.5,14);rev($('t2'),T.imp-.2,t,.65,18);
 ['n2','t2'].forEach(id=>$(id).parentNode.style.transform=`translateX(${-w*1920}px)`);
 // inserto pieno
 const ins=$('ins');const on=t>=WIN&&t<WOUT+.6;ins.style.display=on?'block':'none';
 const down=eio((t-WOUT)/.5);
 ins.style.transform=`translateX(${(1-w)*1920}px) translateY(${down*1100}px)`;
 if(on){
  const st=$('stage');st.style.transform=`translateZ(${eio((t-WIN)/5.4)*60}px)`;
  // Claude: il fiore ruota ed entra
  const pc=ob((t-T.claude)/.6);
  $('cl').style.transform=`rotate(${(1-eo((t-T.claude)/.8))*-120}deg) scale(${.3+.7*pc})`;$('cl').style.filter=`blur(${(1-eo((t-T.claude)/.5))*16}px)`;$('cl').style.opacity=c((t-T.claude)/.08);
  rev($('cln'),T.claude+.2,t,.55,12);
  // la linea si disegna su "MCP"
  $('line').style.transform=`scaleX(${eo((t-T.mcp+.15)/.6)})`;
  rev($('mcp'),T.mcp,t,.45,10);
  // Canva scatta dentro
  const pv=ob((t-T.canva)/.5);$('cv').style.transform=`scale(${.2+.8*pv})`;$('cv').style.opacity=c((t-T.canva)/.06);
  $('cv').style.filter=`blur(${(1-eo((t-T.canva)/.35))*12}px)`;
  rev($('cvn'),T.canva+.15,t,.5,12);
  // collegato: impulso + pezzi di tavola da Claude a Canva
  const lp=c((t-T.coll+.25)/.75);const lx=600+eio(lp)*700;
  $('pulse').style.left=lx+'px';$('pulse').style.opacity=lp>0&&lp<1?1:0;
  $('line').style.background=t>T.coll-.25?`linear-gradient(90deg,#E8692B ${eio(lp)*100}%,#6A6668 ${eio(lp)*100}%)`:'#6A6668';
  pieces.forEach((d,i)=>{const q=c((t-T.coll-.05-i*.09)/.7);const x=600+eio(q)*740;const y=470+Math.sin(q*Math.PI)*(-90+i*45);
   d.style.left=x+'px';d.style.top=y+'px';d.style.opacity=q>0&&q<.97?1:0;d.style.transform=`rotate(${(1-q)*90*(i%2?1:-1)}deg) scale(${.6+.4*Math.sin(q*Math.PI)})`;});
  const bump=Math.exp(-Math.max(0,t-(T.coll+.62))*7)*(t>T.coll+.62?1:0);
  if(t>T.canva+.5)$('cv').style.transform=`scale(${1+.12*bump})`;
  // motion blur verticale quando scende
  ins.style.filter=down>0&&down<1?`blur(${Math.sin(down*Math.PI)*6}px)`:'none';
 }
 $('leak').style.opacity=.32+.1*Math.sin(t*1.3);
 document.querySelectorAll('#grs img').forEach((g,i)=>g.style.display=i==Math.floor(t*24)%8?'block':'none');
};
render(0);
</script></body></html>
