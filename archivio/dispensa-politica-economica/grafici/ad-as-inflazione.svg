<svg viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="660" height="420" fill="white"/>
  <text x="330" y="24" font-size="17" font-weight="bold" text-anchor="middle">Modello AD-AS: inflazione da domanda vs da costi</text>

  <!-- ============ PANNELLO A: inflazione da domanda ============ -->
  <text x="160" y="48" font-size="15" font-weight="bold" text-anchor="middle">A. Inflazione da domanda</text>

  <line x1="60" y1="340" x2="290" y2="340" stroke="black" stroke-width="2"/>
  <line x1="60" y1="340" x2="60" y2="70" stroke="black" stroke-width="2"/>
  <text x="295" y="345" font-size="14">Y</text>
  <text x="45" y="65" font-size="14">p</text>

  <!-- AS0 fissa -->
  <line x1="90" y1="320" x2="250" y2="90" stroke="#1a5276" stroke-width="2.5"/>
  <text x="253" y="88" font-size="13" fill="#1a5276">AS</text>

  <!-- AD0 -->
  <line x1="80" y1="110" x2="270" y2="310" stroke="#922b21" stroke-width="2.5"/>
  <text x="272" y="315" font-size="13" fill="#922b21">AD₀</text>

  <!-- AD1 spostata a destra -->
  <line x1="140" y1="110" x2="290" y2="260" stroke="#922b21" stroke-width="2.5"/>
  <text x="278" y="255" font-size="13" fill="#922b21">AD₁</text>

  <!-- E0: intersezione AS & AD0 -->
  <circle cx="164" cy="248" r="4" fill="black"/>
  <text x="150" y="240" font-size="12">E₀</text>
  <!-- E1: intersezione AS & AD1 (piu' a destra e piu' in alto) -->
  <circle cx="196" cy="211" r="4" fill="black"/>
  <text x="203" y="205" font-size="12">E₁</text>

  <line x1="164" y1="248" x2="164" y2="340" stroke="gray" stroke-dasharray="3,3"/>
  <line x1="196" y1="211" x2="196" y2="340" stroke="gray" stroke-dasharray="3,3"/>
  <line x1="60" y1="248" x2="164" y2="248" stroke="gray" stroke-dasharray="3,3"/>
  <line x1="60" y1="211" x2="196" y2="211" stroke="gray" stroke-dasharray="3,3"/>

  <text x="158" y="356" font-size="11">Y₀</text>
  <text x="190" y="356" font-size="11">Y₁</text>
  <text x="42" y="252" font-size="11">p₀</text>
  <text x="42" y="215" font-size="11">p₁</text>

  <line x1="150" y1="130" x2="205" y2="130" stroke="#922b21" stroke-width="1.3" marker-end="url(#arrowA)"/>
  <defs><marker id="arrowA" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#922b21"/></marker></defs>

  <text x="60" y="380" font-size="11.5" fill="#555">AD si sposta a destra → p ↑ e Y ↑</text>

  <!-- separatore -->
  <line x1="330" y1="45" x2="330" y2="395" stroke="#ccc" stroke-width="1"/>

  <!-- ============ PANNELLO B: inflazione da costi ============ -->
  <text x="500" y="48" font-size="15" font-weight="bold" text-anchor="middle">B. Inflazione da costi/offerta</text>

  <line x1="400" y1="340" x2="630" y2="340" stroke="black" stroke-width="2"/>
  <line x1="400" y1="340" x2="400" y2="70" stroke="black" stroke-width="2"/>
  <text x="635" y="345" font-size="14">Y</text>
  <text x="385" y="65" font-size="14">p</text>

  <!-- AD0 fissa -->
  <line x1="420" y1="110" x2="610" y2="310" stroke="#922b21" stroke-width="2.5"/>
  <text x="613" y="315" font-size="13" fill="#922b21">AD</text>

  <!-- AS0 -->
  <line x1="430" y1="320" x2="590" y2="90" stroke="#1a5276" stroke-width="2.5"/>
  <text x="593" y="88" font-size="13" fill="#1a5276">AS₀</text>

  <!-- AS1 spostata a sinistra/in alto -->
  <line x1="470" y1="320" x2="560" y2="95" stroke="#1a5276" stroke-width="2.5"/>
  <text x="470" y="90" font-size="13" fill="#1a5276">AS₁</text>

  <!-- E0: intersezione AD & AS0 -->
  <circle cx="515" cy="221" r="4" fill="black"/>
  <text x="522" y="215" font-size="12">E₀</text>
  <!-- E1: intersezione AD & AS1 (Y minore, p maggiore) -->
  <circle cx="497" cy="205" r="4" fill="black"/>
  <text x="465" y="200" font-size="12">E₁</text>

  <line x1="515" y1="221" x2="515" y2="340" stroke="gray" stroke-dasharray="3,3"/>
  <line x1="497" y1="205" x2="497" y2="340" stroke="gray" stroke-dasharray="3,3"/>
  <line x1="400" y1="221" x2="515" y2="221" stroke="gray" stroke-dasharray="3,3"/>
  <line x1="400" y1="205" x2="497" y2="205" stroke="gray" stroke-dasharray="3,3"/>

  <text x="491" y="356" font-size="11">Y₁</text>
  <text x="509" y="356" font-size="11">Y₀</text>
  <text x="382" y="225" font-size="11">p₀</text>
  <text x="382" y="209" font-size="11">p₁</text>

  <line x1="510" y1="150" x2="475" y2="130" stroke="#1a5276" stroke-width="1.3" marker-end="url(#arrowB)"/>
  <defs><marker id="arrowB" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#1a5276"/></marker></defs>

  <text x="400" y="380" font-size="11.5" fill="#555">AS si sposta a sinistra/in alto → p ↑ ma Y ↓</text>
</svg>
