<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="640" height="420" fill="white"/>
  <text x="320" y="26" font-size="17" font-weight="bold" text-anchor="middle">Curva di Phillips di breve periodo e aspettative</text>

  <line x1="80" y1="360" x2="560" y2="360" stroke="black" stroke-width="2"/>
  <line x1="80" y1="360" x2="80" y2="55" stroke="black" stroke-width="2"/>
  <text x="568" y="365" font-size="15">u (disoccupazione)</text>
  <text x="30" y="50" font-size="15">π (inflazione)</text>

  <!-- Curva di Phillips di lungo periodo (verticale a u_N) -->
  <line x1="320" y1="360" x2="320" y2="60" stroke="#555" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="326" y="75" font-size="13" fill="#555">PC lungo periodo (verticale)</text>
  <text x="300" y="380" font-size="13">u_N</text>

  <!-- PC0: aspettative basse (pi^e = 2%) -->
  <line x1="150" y1="120" x2="480" y2="300" stroke="#1a5276" stroke-width="2.5"/>
  <text x="485" y="298" font-size="13" fill="#1a5276">PC(πᵉ=2%)</text>

  <!-- PC1: aspettative alte (pi^e = 6%), shift parallelo verso l'alto -->
  <line x1="150" y1="40" x2="480" y2="220" stroke="#922b21" stroke-width="2.5"/>
  <text x="485" y="222" font-size="13" fill="#922b21">PC(πᵉ=6%)</text>

  <!-- Punti sulla verticale -->
  <circle cx="320" cy="213" r="4.5" fill="#1a5276"/>
  <text x="255" y="210" font-size="13">A (π=2%)</text>

  <circle cx="320" cy="133" r="4.5" fill="#922b21"/>
  <text x="255" y="130" font-size="13">B (π=6%)</text>

  <line x1="320" y1="213" x2="320" y2="133" stroke="#7d3c98" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <defs><marker id="arrowP" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#7d3c98"/></marker></defs>

  <text x="60" y="404" font-size="12" fill="#555">↑ Aspettative di inflazione → la curva si sposta verso l'alto; nel lungo periodo u torna sempre a u_N (NAIRU) a inflazione più alta</text>
</svg>
