<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="640" height="420" fill="white"/>
  <text x="320" y="26" font-size="17" font-weight="bold" text-anchor="middle">Modello Mundell-Fleming: IS, LM e BP</text>

  <line x1="80" y1="360" x2="580" y2="360" stroke="black" stroke-width="2"/>
  <line x1="80" y1="360" x2="80" y2="70" stroke="black" stroke-width="2"/>
  <text x="588" y="365" font-size="15">Y</text>
  <text x="55" y="65" font-size="15">i</text>

  <!-- LM -->
  <line x1="140" y1="345" x2="490" y2="100" stroke="#1a5276" stroke-width="2.5"/>
  <text x="495" y="98" font-size="13" fill="#1a5276">LM</text>

  <!-- IS -->
  <line x1="150" y1="100" x2="500" y2="345" stroke="#922b21" stroke-width="2.5"/>
  <text x="503" y="350" font-size="13" fill="#922b21">IS</text>

  <!-- BP a mobilità imperfetta (inclinata positivamente, più ripida della LM) -->
  <line x1="230" y1="345" x2="400" y2="110" stroke="#117864" stroke-width="2.5"/>
  <text x="405" y="108" font-size="13" fill="#117864">BP (mobilità capitali imperfetta)</text>

  <!-- BP a mobilità perfetta (quasi orizzontale) -->
  <line x1="150" y1="222" x2="530" y2="215" stroke="#117864" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="535" y="212" font-size="11.5" fill="#117864">BP (mobilità perfetta, ≈ orizzontale a i_mondo)</text>

  <!-- BP a mobilità nulla (verticale) -->
  <line x1="330" y1="345" x2="330" y2="90" stroke="#117864" stroke-width="1.8" stroke-dasharray="2,3"/>
  <text x="335" y="90" font-size="11.5" fill="#117864">BP (mobilità nulla, verticale)</text>

  <!-- Equilibrio interno-esterno: intersezione IS-LM-BP (imperfetta) -->
  <circle cx="325" cy="222" r="5" fill="black"/>
  <text x="250" y="215" font-size="13">E (equilibrio interno ed esterno)</text>
  <line x1="325" y1="222" x2="325" y2="360" stroke="gray" stroke-dasharray="3,3"/>
  <line x1="80" y1="222" x2="325" y2="222" stroke="gray" stroke-dasharray="3,3"/>

  <text x="60" y="400" font-size="12" fill="#555">La pendenza della BP dipende dal grado di mobilità dei capitali: più i capitali sono mobili, più la BP è piatta (nel limite, orizzontale a i_mondo).</text>
</svg>
