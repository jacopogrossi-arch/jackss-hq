<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="640" height="420" fill="white"/>
  <text x="320" y="26" font-size="17" font-weight="bold" text-anchor="middle">Esternalità negativa: equilibrio privato vs ottimo sociale</text>

  <line x1="80" y1="360" x2="580" y2="360" stroke="black" stroke-width="2"/>
  <line x1="80" y1="360" x2="80" y2="80" stroke="black" stroke-width="2"/>
  <text x="588" y="365" font-size="15">q</text>
  <text x="55" y="75" font-size="15">P</text>

  <!-- D = MB -->
  <line x1="80" y1="144" x2="500" y2="295" stroke="#1a5276" stroke-width="2.5"/>
  <text x="505" y="298" font-size="13" fill="#1a5276">D = MB</text>

  <!-- MPC -->
  <line x1="80" y1="360" x2="480" y2="120" stroke="#117864" stroke-width="2.5"/>
  <text x="485" y="118" font-size="13" fill="#117864">MPC (costo marg. privato)</text>

  <!-- MSC = MPC + costo esterno (=10) -->
  <line x1="80" y1="252" x2="350" y2="106" stroke="#922b21" stroke-width="2.5"/>
  <text x="352" y="104" font-size="13" fill="#922b21">MSC = MPC + costo esterno</text>

  <!-- Cuneo costo esterno a q=0 -->
  <line x1="80" y1="360" x2="80" y2="252" stroke="#922b21" stroke-width="4"/>
  <text x="12" y="310" font-size="12" fill="#922b21">costo</text>
  <text x="12" y="323" font-size="12" fill="#922b21">esterno=10</text>

  <!-- Triangolo DWL tra Qos e Qcp: F(200,187) su D/MSC, Ecp(320,230) su D/MPC, G(320,122) su MSC -->
  <polygon points="200,187 320,230 320,122" fill="#e67e22" fill-opacity="0.45" stroke="#e67e22" stroke-width="1.5"/>
  <text x="325" y="170" font-size="13" fill="#e67e22" font-weight="bold">DWL</text>

  <!-- Ottimo sociale F -->
  <circle cx="200" cy="187" r="4.5" fill="black"/>
  <text x="140" y="180" font-size="12.5">Ottimo sociale (q_OS=2, P=16)</text>
  <line x1="200" y1="187" x2="200" y2="360" stroke="gray" stroke-dasharray="3,3"/>

  <!-- Equilibrio concorrenziale privato Ecp -->
  <circle cx="320" cy="230" r="4.5" fill="black"/>
  <text x="326" y="248" font-size="12.5">Equilibrio privato (q_CP=4, P=12)</text>
  <line x1="320" y1="230" x2="320" y2="360" stroke="gray" stroke-dasharray="3,3"/>

  <text x="193" y="378" font-size="12">q_OS</text>
  <text x="313" y="378" font-size="12">q_CP</text>

  <text x="90" y="402" font-size="12" fill="#555">Il mercato produce troppo (q_CP&gt;q_OS) perché il produttore non internalizza il costo esterno. Tassa pigouviana = costo esterno marginale, qui = 10.</text>
</svg>
